<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squeak · seu time inteiro num lugar só</title>
    <meta name="description" content="Chat, calls, kanban e GitHub conectados. E cada contribuição vira reputação." />
    <meta name="theme-color" content="#0F1420" />
    <meta property="og:title" content="Squeak · seu time inteiro num lugar só" />
    <meta property="og:description" content="Chat, calls, kanban e GitHub conectados. E cada contribuição vira reputação." />
    <meta property="og:image" content="/assets/mascot/og-image.jpg" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/brand/squeak-swim.webp" as="image" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=JetBrains+Mono:wght@400;500;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      // Tema antes do primeiro paint: preferência salva > prefers-color-scheme > escuro.
      (function () {
        var t = null
        try { t = localStorage.getItem('squeak-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
