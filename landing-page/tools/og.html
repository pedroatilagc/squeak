<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Squeak · og-image</title>
    <!-- Ferramenta de desenvolvimento: compõe a imagem de compartilhamento (1200x630).
         Gerar: abrir /tools/og.html no dev server a 1200x630, capturar e salvar em public/assets/mascot/og-image.jpg -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>

      html, body { margin: 0; }
      .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--text); }
      .spine { position: absolute; left: 64px; top: 0; bottom: 0; width: 3px; background: var(--border); }
      .dot { position: absolute; left: 57px; width: 17px; height: 17px; border-radius: 50%; background: var(--bg); border: 3px solid var(--border); box-sizing: border-box; }
      .dot.on { background: var(--duck-yellow); border-color: var(--duck-yellow); box-shadow: 0 0 0 7px var(--glow-yellow); }
      .copy { position: absolute; left: 132px; top: 50%; transform: translateY(-50%); }
      .hash { font: 500 22px 'JetBrains Mono'; color: var(--text-secondary); margin: 0 0 18px; }
      .hash b { color: var(--duck-yellow); font-weight: 500; }
      h1 { margin: 0; font: 800 132px/0.9 'Bricolage Grotesque'; font-variation-settings: 'opsz' 96; letter-spacing: -0.05em; }
      p { margin: 26px 0 0; font: 500 30px 'JetBrains Mono'; color: var(--text-secondary); }
      h1 .br { font: 400 0.72em/1 'JetBrains Mono'; letter-spacing: -0.1em; color: var(--duck-yellow); }
      h1 .br:last-child { margin-left: -0.02em; }
      .glow { position: absolute; right: -40px; top: 50%; width: 600px; height: 600px; transform: translateY(-50%); background: radial-gradient(closest-side, var(--glow-yellow), transparent 75%); }
      .logo { position: absolute; right: 56px; top: 50%; transform: translateY(-52%) rotate(-4deg); width: 430px; filter: drop-shadow(0 22px 34px rgba(0,0,0,.4)); }
      .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: var(--duck-yellow); }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="spine"></div>
      <span class="dot" style="top: 150px"></span>
      <span class="dot" style="top: 300px"></span>
      <span class="dot on" style="top: 450px"></span>
      <div class="glow"></div>
      <img class="logo" src="/brand/squeak-logo.webp" alt="" />
      <div class="copy">
        <p class="hash"><b>e1f0a2c</b> init: seu time num lugar só</p>
        <h1><span class="br">&lt;</span>squeak<span class="br">/&gt;</span></h1>
        <p>entregou? contou.</p>
      </div>
      <div class="bar"></div>
    </div>
    <script>
      document.fonts.ready.then(() => (document.body.dataset.ready = '1'))
    </script>
  </body>
</html>
