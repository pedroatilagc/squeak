[build]
rustflags = ["-C", "target-feature=+crt-static"]
# O libwebrtc pré-compilado tem headers em caminhos muito fundos: com o target dentro do repositório o caminho
# passa de 260 caracteres e o cl.exe falha (C1083). O mesmo diretório do PartilharTela reaproveita o cache de build.
target-dir = "C:/pt-target"
